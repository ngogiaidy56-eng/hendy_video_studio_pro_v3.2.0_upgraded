<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing Accent Shape -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Film Frame Outer -->
  <rect x="120" y="140" width="272" height="232" rx="32" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Play Triangle Center -->
  <path d="M228 206 L324 256 L228 306 Z" fill="url(#cyanGrad)" filter="url(#glow)"/>

  <!-- Sparkle AI Star Top Right -->
  <path d="M374 130 C374 146 386 158 402 158 C386 158 374 170 374 186 C374 170 362 158 346 158 C362 158 374 146 374 130 Z" fill="#38bdf8"/>
  <circle cx="374" cy="158" r="4" fill="#ffffff"/>

  <!-- Audio Waves Indicator Bottom -->
  <rect x="168" y="320" width="8" height="24" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="186" y="312" width="8" height="32" rx="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="204" y="324" width="8" height="20" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="300" y="324" width="8" height="20" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="318" y="312" width="8" height="32" rx="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="336" y="320" width="8" height="24" rx="4" fill="#38bdf8" opacity="0.8"/>
</svg>
